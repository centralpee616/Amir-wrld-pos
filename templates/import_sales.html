<!DOCTYPE html>
<html>

<head>
    <title>Import Sales Backup</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h2>Import Sales Backup</h2>

    <p>
        Select an AMIR WRLD Excel backup file to
        restore previous sales.
    </p>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <label>Backup File</label>

        <input
            type="file"
            name="backup_file"
            accept=".xlsx"
            required
        >

        <br><br>

        <button type="submit">
            Import Sales
        </button>

    </form>

    <br>

    <a href="/">
        Back to Dashboard
    </a>

</div>

</body>

</html>
