<!DOCTYPE html>
<html>

<head>

    <title>Edit Sale</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script>

function updatePrices() {

    const service =
        document.getElementById("service").value;

    const price =
        document.getElementById("price");
const customDescription =
    document.getElementById(
        "custom-description"
    );

const customAmount =
    document.getElementById(
        "custom-amount"
    );

const priceGroup =
    document.getElementById(
        "price-group"
    );
    const currentPrice =
        "{{ sale.amount }}";

    price.innerHTML = "";
    customDescription.style.display =
"none";

customAmount.style.display =
"none";

priceGroup.style.display =
"block";

price.required = true;

if(service === "Custom"){

    customDescription.style.display =
    "block";

    customAmount.style.display =
    "block";

    priceGroup.style.display =
    "none";

    price.required = false;

    return;
}   
if(service === "Kanak Kanak") {

        price.innerHTML = `
            <option value="10">RM10</option>
            <option value="15">RM15</option>
        `;
    }

    else if(service === "Remaja/Budak Sekolah") {

        price.innerHTML = `
            <option value="15">RM15</option>
            <option value="20">RM20</option>
            <option value="25">RM25</option>
        `;
    }

    else if(service === "Dewasa") {

        price.innerHTML = `
            <option value="20">RM20</option>
            <option value="25">RM25</option>
            <option value="30">RM30</option>
            <option value="35">RM35</option>
        `;
    }

    for(let option of price.options){

        if(option.value === currentPrice){

            option.selected = true;

        }

    }

}

window.onload = function(){

    updatePrices();

}
</script>
<body>

<div class="header">

    <h1>AMIR WRLD</h1>

</div>

<div class="form-container">

    <h2 class="form-title">
        Edit Transaction
    </h2>

    <form method="POST">

        <div class="input-group">

    <label>Service</label>

    <select
        name="service"
        id="service"
        required
        onchange="updatePrices()">

        <option value="Kanak Kanak"
        {% if sale.service == 'Kanak Kanak' %}selected{% endif %}>
            Kanak Kanak
        </option>

        <option value="Remaja/Budak Sekolah"
        {% if sale.service == 'Remaja/Budak Sekolah' %}selected{% endif %}>
            Remaja/Budak Sekolah
        </option>

        <option value="Dewasa"
        {% if sale.service == 'Dewasa' %}selected{% endif %}>
            Dewasa
        </option>

        <option value="Custom">
    Custom
</option>

    </select>

</div>

 <div
class="input-group"
id="price-group">

    <label>Price</label>

    <select
        name="amount"
        id="price"
        required>

        <option value="{{ sale.amount }}">
            RM {{ sale.amount }}
        </option>

    </select>

</div>

<div
class="input-group"
id="custom-description"
style="display:none;">

    <label>Description</label>

    <input
        type="text"
        name="custom_description"
        placeholder="Example: Hair Wash">

</div>

<div
class="input-group"
id="custom-amount"
style="display:none;">

    <label>Custom Amount (RM)</label>

    <input
        type="number"
        step="0.01"
        name="custom_amount">

</div>

        <div class="input-group">

            <label>Barber</label>

            <select name="barber">

                {% for barber in barbers %}

                <option
                value="{{ barber.id }}"
                {% if barber.id == sale.barber_id %}
                selected
                {% endif %}>

                    {{ barber.name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <button
        class="save-btn"
        type="submit">

            Save Changes

        </button>

    </form>

</div>

</body>

</html>
