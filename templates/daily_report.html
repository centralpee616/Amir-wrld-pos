<!DOCTYPE html>
<html>
<h2>

Selected Date:
{{ selected_date }}

</h2>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Daily Report</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="header">

    <h1>AMIR WRLD</h1>

    <p>Daily Report</p>

</div>

<div class="card">

    <div class="card-title">
        TODAY'S SALES
    </div>

    <div class="card-value">
        RM {{ total }}
    </div>

</div>

<div class="transactions">

    <table>

        <tr>
            <th>Date/Time</th>
            <th>Service</th>
            <th>Barber</th>
            <th>Amount</th>
        </tr>

        {% for sale in sales %}

        <tr>
            <td>
                {{ sale.date.strftime('%d/%m/%Y %H:%M') }}
            </td>
            <td>{{ sale.service }}</td>
            <td>{{ sale.barber.name }}</td>
            <td>RM {{ sale.amount }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

<br>

<a href="/" class="btn">
    Dashboard
</a>

</body>

</html>
